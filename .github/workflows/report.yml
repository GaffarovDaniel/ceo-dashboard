# ПР №5. Автоматическая сборка отчёта и дашборда при каждом обновлении данных
name: Build CEO report

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:          # ручной запуск кнопкой Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: pip install -r requirements.txt

      - name: Очистить данные
        run: python scripts/01_clean_data.py

      - name: Собрать HTML-отчёт
        run: python scripts/02_build_report.py

      - name: Собрать дашборд
        run: python scripts/03_build_dashboard.py

      - name: Сохранить результат в репозиторий
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed docs
          git diff --cached --quiet || git commit -m "Автообновление отчёта $(date +'%Y-%m-%d %H:%M')"
          git push
